name: Bug report
description: Something in OTIS doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OTIS version
      description: Help → About OTIS
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run OTIS?
      options:
        - install.sh (native)
        - install.sh --docker
        - AUR package
        - node server.js
        - docker compose
        - Static files (no server)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chromium 152 on Omarchy
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: The project file (File → Download project) or the server log (journalctl --user -u otis) if it's relevant.
