<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTIS</title>
  <meta name="description" content="OTIS — Omarchy Text Interface Studio. Design terminal UIs with boxes, text, arrows and glyphs.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/colorpicker.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand" title="Omarchy Text Interface Studio"><span class="brand-mark">▛▜</span>OTIS</div>
      <nav class="menus">
        <button type="button" class="menu-btn" data-menu="file">File</button>
        <button type="button" class="menu-btn" data-menu="edit">Edit</button>
        <button type="button" class="menu-btn" data-menu="view">View</button>
        <button type="button" class="menu-btn" data-menu="help">Help</button>
      </nav>
      <input id="project-name" type="text" spellcheck="false" aria-label="Project name" title="Project name">
      <span id="save-status" aria-live="polite"></span>
      <div class="spacer"></div>
      <button type="button" id="btn-undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button type="button" id="btn-redo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <div class="zoom">
        <button type="button" id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-label" title="Zoom to fit (0)">100%</button>
        <button type="button" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      </div>
      <button type="button" id="btn-export" class="primary" title="Export (Ctrl+E)">Export</button>
      <div class="seg" id="sidebar-mode" role="group" aria-label="Sidebar width">
        <button type="button" data-mode="slim" title="Slim sidebar — one column of panels" aria-label="Slim sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M15 4v16"/></svg></button>
        <button type="button" data-mode="wide" title="Wide sidebar — two columns of panels" aria-label="Wide sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M10 4v16M15.5 4v16"/></svg></button>
      </div>
    </header>
    <nav id="toolbar" aria-label="Tools"></nav>
    <div id="options"></div>
    <main id="stage"><canvas id="canvas" tabindex="0" aria-label="Design canvas"></canvas></main>
    <aside id="sidebar"></aside>
    <footer id="statusbar">
      <span id="st-pos"></span>
      <span id="st-sel"></span>
      <span class="spacer"></span>
      <span id="st-size"></span>
      <span id="st-storage"></span>
    </footer>
  </div>
  <div id="toast" role="status"></div>
  <div id="menu-pop" class="menu-pop" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
