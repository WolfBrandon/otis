# Phosphor — cypherpunk green-screen. P1-phosphor text on CRT black, with
# neon cyan/magenta/amber left in the ANSI slots so the palette isn't monochrome.
mode = "dark"

accent = "#3dff8e"
selection = "#0d3b1e"
muted = "#1f6b3a"

background = "#050a06"
